<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 399" width="900" height="399"
     role="img" aria-labelledby="title description">
  <title id="title">Steering prediction with missing history frames</title>
  <desc id="description">Frozen DINOv2 features pass through history sampling and a shared
    projection. LSTM, CfC and LTC use the time between successive retained frames.
    The Transformer uses timestamps relative to the current frame.
    Each temporal model can predict the current angle or four anticipation
    horizons. The single-frame MLP is used only for anticipation. Each readout is
    rescaled to steering-wheel degrees.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6"
            markerHeight="6" orient="auto">
      <path d="M0 0 L8 4 L0 8 Z" fill="#415768"/>
    </marker>
    <style>
      text { font-family: Arial, Helvetica, sans-serif; text-anchor: middle; fill: #182e3c; }
      .heading { font-size: 18px; font-weight: 700; }
      .detail { font-size: 16px; }
      .label { font-size: 15px; fill: #3d5665; text-anchor: start; }
      .result { font-size: 18px; font-weight: 700; fill: #125954; }
      .box { fill: #f7f9fa; stroke: #8496a1; stroke-width: 1.5; }
      .model { fill: #edf4f8; stroke: #638199; }
      .head { fill: #edf6f3; stroke: #638c82; }
      .flow { fill: none; stroke: #415768; stroke-width: 1.8; stroke-linejoin: round;
              marker-end: url(#arrow); }
    </style>
  </defs>
  <rect width="900" height="399" fill="#fff"/>

  <g aria-label="Feature preparation">
    <rect class="box" x="16" y="17" width="264" height="78" rx="7"/>
    <text class="heading" x="148" y="41">Frozen DINOv2 features</text>
    <text class="detail" x="148" y="63">30 frames at 10 Hz</text>
    <text class="detail" x="148" y="83">1,536 features per frame</text>

    <path class="flow" d="M280 56 H311"/>
    <rect class="box" x="314" y="17" width="264" height="78" rx="7"/>
    <text class="heading" x="446" y="41">Sample history frames</text>
    <text class="detail" x="446" y="63">Keep rate 1, 0.5 or 0.25</text>
    <text class="detail" x="446" y="83">Always keep the current frame</text>

    <path class="flow" d="M578 56 H609"/>
    <rect class="box" x="612" y="17" width="272" height="78" rx="7"/>
    <text class="heading" x="748" y="41">Project each retained frame</text>
    <text class="detail" x="748" y="63">LayerNorm + linear projection</text>
    <text class="detail" x="748" y="83">1,536 → 64 features</text>
  </g>

  <g aria-label="Model alternatives">
    <path class="flow" stroke-dasharray="5 4" d="M345 95 V105 H238 V140"/>
    <text class="label" x="36" y="131">Δt between retained frames</text>
    <path class="flow" d="M748 115 H282 V140"/>
    <path class="flow" d="M748 95 V140"/>
    <circle cx="748" cy="115" r="3" fill="#415768"/>

    <rect class="box model" x="76" y="143" width="412" height="78" rx="7"/>
    <text class="heading" x="282" y="168">Temporal model</text>
    <text class="detail" x="282" y="190">LSTM, CfC, LTC or Transformer</text>
    <text class="detail" x="282" y="210">Use the last retained state</text>

    <rect class="box model" x="612" y="143" width="272" height="78" rx="7"/>
    <text class="heading" x="748" y="168">Single-frame MLP</text>
    <text class="detail" x="748" y="190">Use the current frame only</text>
    <text class="detail" x="748" y="210">64 → 256 → 64 features</text>
  </g>

  <g aria-label="Task-specific readouts">
    <path class="flow" d="M282 221 V269"/>
    <path class="flow" d="M282 244 H630 V269"/>
    <path class="flow" d="M748 221 V269"/>
    <circle cx="282" cy="244" r="3" fill="#415768"/>

    <rect class="box head" x="116" y="272" width="332" height="54" rx="7"/>
    <text class="heading" x="282" y="295">Current-angle prediction</text>
    <text class="detail" x="282" y="316">64 → 1 linear readout</text>

    <rect class="box head" x="533" y="272" width="338" height="54" rx="7"/>
    <text class="heading" x="702" y="295">Steering anticipation</text>
    <text class="detail" x="702" y="316">64 → 4 linear readout</text>

    <path class="flow" d="M282 326 V360"/>
    <text class="label" x="293" y="348">Rescale to degrees</text>
    <path class="flow" d="M702 326 V360"/>
    <text class="label" x="713" y="348">Rescale to degrees</text>
    <text class="result" x="282" y="383">Current steering angle</text>
    <text class="result" x="702" y="383">Angles at 0, 0.5, 1 and 2 s</text>
  </g>
</svg>
